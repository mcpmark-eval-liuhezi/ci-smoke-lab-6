name: demo-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write short file
        run: |
          echo "This file was produced by the demo-build CI job on ${GITHUB_RUN_DATE}." > build-artifact.txt
          cat build-artifact.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: build-artifact.txt
